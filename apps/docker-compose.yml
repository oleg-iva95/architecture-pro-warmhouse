services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smarthome
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network

  devices-postgres:
    image: postgres:16-alpine
    container_name: smarthome-devices-postgres
    environment:
      - POSTGRES_USER=devices
      - POSTGRES_PASSWORD=devices
      - POSTGRES_DB=devices
    volumes:
      - devices_postgres_data:/var/lib/postgresql/data
      - ./device-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devices"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: smarthome-temperature-api
    ports:
      - "8081:8081"
    networks:
      - smarthome-network

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: smarthome-device-service
    environment:
      - MONOLITH_URL=http://app:8080
      - DEVICE_DB_HOST=devices-postgres
      - DEVICE_DB_PORT=5432
      - DEVICE_DB_NAME=devices
      - DEVICE_DB_USER=devices
      - DEVICE_DB_PASSWORD=devices
    ports:
      - "8082:8082"
    depends_on:
      devices-postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  devices_postgres_data:

networks:
  smarthome-network:
    driver: bridge
