openapi: 3.0.3
info:
  title: Умный Дом - REST API
  version: 1.0.0
  description: Синхронные вызовы между сервисами проверки доступа, реестра устройств и климат-контроля.

paths:

  /v1/access/check:
    post:
      summary: Проверить, разрешено ли пользователю действие с устройством
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userId, deviceId, action]
              properties:
                userId:
                  type: string
                  format: uuid
                deviceId:
                  type: string
                  format: uuid
                action:
                  type: string
                  enum: [TurnOn, TurnOff, Open, Close, View, Edit, Delete, ViewArchive]
            examples:
              example:
                value:
                  userId: "9f1b2e2a-1111-4a2b-8c3d-000000000001"
                  deviceId: "7c4a3d10-2222-4b1a-9c3d-000000000002"
                  action: TurnOn
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string
              examples:
                allowed:
                  summary: Доступ разрешён
                  value:
                    allowed: true
                denied:
                  summary: Доступ запрещён
                  value:
                    allowed: false
                    reason: "Пользователь не является владельцем дома"
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                example:
                  value:
                    code: INVALID_REQUEST
                    message: "Поле action обязательно"
        '500':
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

  /v1/devices:
    post:
      summary: Зарегистрировать устройство (сущность Device)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [houseId, typeId, serialNumber]
              properties:
                houseId:
                  type: string
                  format: uuid
                typeId:
                  type: string
                  description: "Ссылается на DeviceType (thermostat, light, gate, camera)"
                serialNumber:
                  type: string
                name:
                  type: string
                location:
                  type: string
            examples:
              example:
                value:
                  houseId: "3a2b1c00-aaaa-4b1a-9c3d-000000000010"
                  typeId: thermostat
                  serialNumber: "TH-2026-00142"
                  name: "Термостат, гостиная"
                  location: "Гостиная"
      responses:
        '201':
          description: Устройство создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  typeId:
                    type: string
                  houseId:
                    type: string
                    format: uuid
                  serialNumber:
                    type: string
                  name:
                    type: string
                  location:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
              examples:
                example:
                  value:
                    id: "7c4a3d10-2222-4b1a-9c3d-000000000002"
                    typeId: thermostat
                    houseId: "3a2b1c00-aaaa-4b1a-9c3d-000000000010"
                    serialNumber: "TH-2026-00142"
                    name: "Термостат, гостиная"
                    location: "Гостиная"
                    status: inactive
                    createdAt: "2026-11-01T09:00:00Z"
        '400':
          description: Не хватает обязательных полей
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                example:
                  value:
                    code: INVALID_REQUEST
                    message: "Поле serialNumber обязательно"
        '403':
          description: Дом принадлежит другому пользователю
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                example:
                  value:
                    code: HOUSE_NOT_OWNED
                    message: "Дом принадлежит другому пользователю"
        '409':
          description: Устройство с таким serialNumber уже зарегистрировано
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                example:
                  value:
                    code: ALREADY_EXISTS
                    message: "Устройство с таким serialNumber уже зарегистрировано"
        '500':
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

  /v1/devices/{id}/owner:
    get:
      summary: Узнать владельца устройства (House.owner_user_id)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Владелец найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId:
                    type: string
                    format: uuid
                  houseId:
                    type: string
                    format: uuid
                  ownerUserId:
                    type: string
                    format: uuid
              examples:
                example:
                  value:
                    deviceId: "7c4a3d10-2222-4b1a-9c3d-000000000002"
                    houseId: "3a2b1c00-aaaa-4b1a-9c3d-000000000010"
                    ownerUserId: "9f1b2e2a-1111-4a2b-8c3d-000000000001"
        '404':
          description: Устройство не найдено
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                example:
                  value:
                    code: NOT_FOUND
                    message: "Устройство не найдено"
        '500':
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string

  /v1/climate/devices/{id}/heating:
    patch:
      summary: Включить/выключить отопление (обновляет ClimateState)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [TurnOn, TurnOff]
                targetTemperature:
                  type: number
                  description: "Обязательно при action=TurnOn, соответствует ClimateState.target_temperature"
            examples:
              example:
                value:
                  action: TurnOn
                  targetTemperature: 22.5
      responses:
        '202':
          description: Команда принята, ClimateState обновится асинхронно
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId:
                    type: string
                    format: uuid
                  targetTemperature:
                    type: number
                  currentTemperature:
                    type: number
                  mode:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
              examples:
                example:
                  value:
                    deviceId: "7c4a3d10-2222-4b1a-9c3d-000000000002"
                    targetTemperature: 22.5
                    currentTemperature: 20.1
                    mode: pending
                    updatedAt: "2026-11-01T09:16:00Z"
        '400':
          description: Некорректное действие (например, нет targetTemperature при TurnOn)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '403':
          description: Доступ запрещён (проверка прав не пройдена)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
              examples:
                example:
                  value:
                    code: ACCESS_DENIED
                    message: "Недостаточно прав для управления этим устройством"
        '404':
          description: Устройство не найдено или не является термостатом
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '500':
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
